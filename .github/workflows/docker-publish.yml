name: Build and publish Docker image

on:
  workflow_dispatch:
    inputs:
      lrcget_version:
        description: "Optional LRCGET version to build, for example 2.2.1. Leave blank for latest."
        required: false
        type: string
  repository_dispatch:
    types:
      - lrcget-release
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile
      - README.md
      - startapp.sh
      - .github/workflows/docker-publish.yml
      - .github/scripts/**
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - startapp.sh
      - .github/workflows/docker-publish.yml
      - .github/scripts/**
  schedule:
    - cron: "0 8 * * *"

# Serialize publishing and sync; PR validation has its own group.
concurrency:
  group: lrcget-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: crywolf203/lrcget-unraid
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_VERSION: 1.1.0

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.lrcget.outputs.version }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Test version synchronization
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Detect version-only changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/sync-version.py classify

      - name: Resolve LRCGET version
        id: lrcget
        shell: bash
        env:
          WORKFLOW_VERSION: ${{ inputs.lrcget_version }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail

          VERSION="${WORKFLOW_VERSION:-}"
          SOURCE="workflow input"

          if [ -z "$VERSION" ]; then
            VERSION="${DISPATCH_VERSION:-}"
            SOURCE="repository dispatch payload"
          fi

          if [ -z "$VERSION" ] && { [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$GITHUB_EVENT_NAME" = "pull_request" ]; }; then
            VERSION="$(sed -nE 's/^ARG LRCGET_VERSION=v?([^[:space:]]+).*/\1/p' Dockerfile | head -n 1)"
            SOURCE="Dockerfile"
          fi

          if [ -z "$VERSION" ]; then
            VERSION="$(curl -fsSL https://api.github.com/repos/tranxuanthang/lrcget/releases/latest \
              | jq -r '.tag_name // empty' \
              | sed -E 's/^v//')"
            SOURCE="latest upstream release"
          fi

          VERSION="${VERSION#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable LRCGET version in major.minor.patch format."
            exit 1
          fi

          DEB_URL="https://github.com/tranxuanthang/lrcget/releases/download/${VERSION}/LRCGET_${VERSION}_amd64.deb"
          if ! curl -fsI "$DEB_URL" >/dev/null; then
            echo "Expected LRCGET .deb asset was not found: $DEB_URL"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "deb_url=$DEB_URL" >> "$GITHUB_OUTPUT"
          echo "LRCGET version: $VERSION ($SOURCE)"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if LRCGET version image already exists
        id: image_exists
        shell: bash
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.lrcget.outputs.version }}"

          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists: $IMAGE"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image does not exist yet: $IMAGE"
          fi

      - name: Decide build mode
        id: build_mode
        shell: bash
        env:
          IMAGE_EXISTS: ${{ steps.image_exists.outputs.exists }}
          METADATA_ONLY: ${{ steps.changes.outputs.metadata_only }}
        run: |
          set -euo pipefail

          SHOULD_BUILD="true"
          SHOULD_PUSH="true"

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            SHOULD_PUSH="false"
          fi

          if { [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; } && [ "${IMAGE_EXISTS:-false}" = "true" ]; then
            SHOULD_BUILD="false"
            SHOULD_PUSH="false"
          fi

          # A published image already validates a version-only change.
          if [ "${METADATA_ONLY:-false}" = "true" ] && [ "${IMAGE_EXISTS:-false}" = "true" ]; then
            SHOULD_BUILD="false"
            SHOULD_PUSH="false"
          fi

          echo "build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"
          echo "push=$SHOULD_PUSH" >> "$GITHUB_OUTPUT"
          echo "build=$SHOULD_BUILD push=$SHOULD_PUSH"

      - name: Set up Docker Buildx
        if: steps.build_mode.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build image
        if: steps.build_mode.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.build_mode.outputs.push == 'true' }}
          build-args: |
            LRCGET_VERSION=${{ steps.lrcget.outputs.version }}
            IMAGE_VERSION=${{ env.IMAGE_VERSION }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.lrcget.outputs.version }}

  publish-github-release:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout verified workflow revision
        uses: actions/checkout@v5

      - name: Publish GitHub release for the available image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_VERSION: ${{ needs.build-and-push.outputs.version }}
        run: python3 .github/scripts/publish-release.py

  sync-published-version:
    needs: build-and-push
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'repository_dispatch' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout current main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Update displayed version
        env:
          PUBLISHED_VERSION: ${{ needs.build-and-push.outputs.version }}
        run: python3 .github/scripts/sync-version.py update "$PUBLISHED_VERSION"

      - name: Open or update version pull request
        id: sync_pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.RELEASE_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          branch: automation/sync-published-version
          base: main
          delete-branch: true
          add-paths: |
            Dockerfile
            README.md
          commit-message: "chore: sync published LRCGET version"
          title: "chore: sync published LRCGET version"
          body: |
            Synchronize the Dockerfile default and README with the successfully published LRCGET ${{ needs.build-and-push.outputs.version }} image.

            Publication verified by [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
            Version-only changes reuse the published image instead of rebuilding it.

      - name: Enable optional auto-merge
        if: >-
          vars.RELEASE_SYNC_AUTOMERGE == 'true' &&
          steps.sync_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SYNC_TOKEN }}
          PR_URL: ${{ steps.sync_pr.outputs.pull-request-url }}
          PR_SHA: ${{ steps.sync_pr.outputs.pull-request-head-sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Set RELEASE_SYNC_TOKEN for unattended PR checks and auto-merge."
            exit 0
          fi
          gh pr merge --auto --squash --match-head-commit "$PR_SHA" "$PR_URL"
